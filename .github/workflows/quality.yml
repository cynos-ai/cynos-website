name: quality

on:
  push:
    branches: [main, develop, scenario-testing]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: docker build --tag cynos-website:ci .
